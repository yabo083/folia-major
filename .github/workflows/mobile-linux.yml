name: Build Linux and Android artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - tauri-rewrite

concurrency:
  group: folia-platform-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: 24

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Debian and AppImage packages
        run: npx tauri build --ci --bundles deb,appimage

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: folia-linux-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  android:
    name: Android ARM64 debug APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools ndk;29.0.14206865

      - name: Set NDK_HOME
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project
        run: npx tauri android init --ci --skip-targets-install

      - name: Verify NDK clang toolchain
        run: |
          NDK_BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK_HOME: $NDK_HOME"
          if [ -x "$NDK_BIN/aarch64-linux-android24-clang" ]; then
            "$NDK_BIN/aarch64-linux-android24-clang" --version
          else
            echo "::error::aarch64-linux-android24-clang not found in $NDK_BIN"
            ls -la "$NDK_BIN" || true
            exit 1
          fi

      - name: Build ARM64 debug APK
        run: npx tauri android build --ci --debug --apk --target aarch64

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: folia-android-arm64-debug-${{ github.sha }}
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
