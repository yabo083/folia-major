# Linux packaging: Debian + AppImage artifacts for the tauri-rewrite branch.
# Independent of android.yml so a Linux failure does not re-run Android (and
# vice versa). Triggered on push to tauri-rewrite or manually via workflow_dispatch.

name: Linux packages

on:
  workflow_dispatch:
  push:
    branches:
      - tauri-rewrite

concurrency:
  group: folia-linux-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: 24

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      # 消掉 checkout/内部 git init 的 `init.defaultBranch` hint（无害但刷屏）。
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Debian and AppImage packages
        run: npx tauri build --ci --bundles deb,appimage

      - name: Upload Linux packages
        uses: actions/upload-artifact@v5
        with:
          name: folia-linux-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
